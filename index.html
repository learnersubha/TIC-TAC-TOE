    <title>TicTacToe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

        <div class="container">

                <button class="box"></button>

                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
        </div>
        <button id="restart-button">RESTART GAME</button>

    </main>



    <script src="script.js"></script>
</body>

</html>
